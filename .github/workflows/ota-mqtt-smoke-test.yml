name: PUSH FIRMWARE

on:
  workflow_dispatch:
    inputs:
      product_type:
        description: "Product type (determines feed folder)"
        required: true
        default: ""
        type: choice
        options:
          - BMS
          - BRIDGE
          - METER

      device_id:
        description: "Target device short ID"
        required: true
        default: ""
        type: string

      board:
        description: "Firmware binary to test"
        required: true
        default: ""
        type: choice
        options:
          - OPF_WS
          - ESP32-S3-RS485-CAN
          - ATOM_S3_R
          - ATOM_S3

      package_version:
        description: "Firmware package version folder (use latest or vX.Y.Z)"
        required: true
        default: "latest"
        type: string

      firmware_url:
        description: "Optional direct firmware URL override"
        required: false
        type: string

      timeout_seconds:
        description: "Max seconds to wait for OTA success/reboot"
        required: true
        default: "420"
        type: string

permissions:
  contents: read

jobs:
  ota-test:
    name: OTA test over MQTT
    runs-on: ubuntu-latest
    environment: QA

    concurrency:
      group: ota-smoke-${{ inputs.device_id }}
      cancel-in-progress: false

    env:
      MQTT_HOST: ${{ secrets.MQTT_HOST }}
      MQTT_PORT: ${{ secrets.MQTT_PORT }}
      MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}

      DEVICE_ID: ${{ inputs.device_id }}
      BOARD: ${{ inputs.board }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      FIRMWARE_URL_INPUT: ${{ inputs.firmware_url }}
      TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}

      FEED_REPOSITORY: opelpanfan/OPF-FIRMWARE-FEED
      FEED_BRANCH: main
      FEED_PRODUCT: ${{ inputs.product_type }}

    steps:
      # ------------------------------------------------------------
      # Validate configuration
      # ------------------------------------------------------------
      - name: Validate required secrets and inputs
        run: |
          set -euo pipefail

          : "${MQTT_HOST:?Missing secret MQTT_HOST}"
          : "${DEVICE_ID:?Missing required input device_id}"

          if [[ -z "${MQTT_PORT:-}" ]]; then
            echo "MQTT_PORT not set; defaulting to 1883"
            echo "MQTT_PORT=1883" >> "$GITHUB_ENV"
          fi

          if ! [[ "${TIMEOUT_SECONDS}" =~ ^[0-9]+$ ]]; then
            echo "timeout_seconds must be a positive integer"
            exit 1
          fi

          if [[ "${TIMEOUT_SECONDS}" -le 0 ]]; then
            echo "timeout_seconds must be greater than zero"
            exit 1
          fi

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Install test dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            mosquitto-clients \
            jq \
            netcat-openbsd

      # ------------------------------------------------------------
      # Resolve firmware URL
      # ------------------------------------------------------------
      - name: Resolve and preflight firmware URL
        run: |
          set -euo pipefail

          firmware_url="${FIRMWARE_URL_INPUT}"

          if [[ -z "${firmware_url}" ]]; then
            firmware_url="https://raw.githubusercontent.com/${FEED_REPOSITORY}/${FEED_BRANCH}/${FEED_PRODUCT}/${PACKAGE_VERSION}/${BOARD}.bin"
          fi

          echo "Firmware URL:"
          echo "${firmware_url}"

          http_code=$(curl \
            --location \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --connect-timeout 15 \
            --max-time 60 \
            "${firmware_url}")

          if [[ "${http_code}" != "200" ]]; then
            echo "Firmware URL preflight failed: HTTP ${http_code}"
            echo "URL: ${firmware_url}"
            exit 1
          fi

          echo "Firmware URL preflight successful"
          echo "RESOLVED_FIRMWARE_URL=${firmware_url}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # MQTT connectivity
      # ------------------------------------------------------------
      - name: Diagnose MQTT connectivity
        run: |
          set -euo pipefail

          echo "Testing DNS resolution for MQTT broker host"
          getent hosts "$MQTT_HOST"

          echo "Testing TCP connectivity to ${MQTT_HOST}:${MQTT_PORT}"
          nc -vz -w 10 "$MQTT_HOST" "$MQTT_PORT"

      # ------------------------------------------------------------
      # OTA
      # ------------------------------------------------------------
      - name: Send OTA command and validate reboot
        run: |
          set -euo pipefail

          cmd_topic="storage/${DEVICE_ID}/cmd/update"
          ack_topic="storage/${DEVICE_ID}/cmd/ack"

          firmware_url="${RESOLVED_FIRMWARE_URL}"

          # Device expects ONLY the raw URL.
          #
          # Example:
          #
          # https://raw.githubusercontent.com/.../OPF_WS.bin
          #
          # NOT:
          #
          # {"url":"https://..."}
          #
          # and NOT:
          #
          # "https://..."
          #
          payload="${firmware_url}"

          # Publisher and subscriber MUST have different MQTT IDs.
          sub_client_id="gha-ota-sub-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pub_client_id="gha-ota-pub-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          mqtt_common_args=(
            -V mqttv311
            -h "$MQTT_HOST"
            -p "$MQTT_PORT"
          )

          if [[ -n "${MQTT_USERNAME:-}" ]]; then
            mqtt_common_args+=( -u "$MQTT_USERNAME" )
          fi

          if [[ -n "${MQTT_PASSWORD:-}" ]]; then
            mqtt_common_args+=( -P "$MQTT_PASSWORD" )
          fi

          echo "======================================================"
          echo "OTA TEST"
          echo "======================================================"
          echo "Device:       ${DEVICE_ID}"
          echo "Board:        ${BOARD}"
          echo "Product:      ${FEED_PRODUCT}"
          echo "Version dir:  ${PACKAGE_VERSION}"
          echo "Command:      ${cmd_topic}"
          echo "ACK:          ${ack_topic}"
          echo "Firmware URL:"
          echo "${firmware_url}"
          echo "======================================================"

          ack_log="$(mktemp)"

          echo "ACK log: ${ack_log}"

          cleanup() {
            if [[ -n "${sub_pid:-}" ]]; then
              kill "$sub_pid" 2>/dev/null || true
              wait "$sub_pid" 2>/dev/null || true
            fi

            rm -f "$ack_log" 2>/dev/null || true
          }

          trap cleanup EXIT

          # --------------------------------------------------------
          # Start subscriber BEFORE sending OTA command
          # --------------------------------------------------------

          echo
          echo "Starting MQTT ACK subscriber..."

          mosquitto_sub \
            "${mqtt_common_args[@]}" \
            -i "$sub_client_id" \
            -t "$ack_topic" \
            -v \
            >"$ack_log" 2>&1 &

          sub_pid=$!

          sleep 2

          if ! kill -0 "$sub_pid" 2>/dev/null; then
            echo "MQTT subscriber exited before OTA command was published"
            echo
            echo "Subscriber output:"
            cat "$ack_log" || true
            exit 1
          fi

          # --------------------------------------------------------
          # Publish OTA command
          # --------------------------------------------------------

          max_publish_attempts=5
          publish_attempt=1
          publish_succeeded=0

          while [[ "$publish_attempt" -le "$max_publish_attempts" ]]; do

            echo
            echo "MQTT publish attempt ${publish_attempt}/${max_publish_attempts}"

            if mosquitto_pub \
              "${mqtt_common_args[@]}" \
              -i "$pub_client_id" \
              -t "$cmd_topic" \
              -m "$payload"
            then
              echo "MQTT OTA command published successfully"
              publish_succeeded=1
              break
            fi

            if [[ "$publish_attempt" -lt "$max_publish_attempts" ]]; then

              sleep_seconds=$((publish_attempt * 2))

              echo "MQTT publish failed."
              echo "Retrying in ${sleep_seconds}s..."

              sleep "$sleep_seconds"
            fi

            publish_attempt=$((publish_attempt + 1))
          done

          if [[ "$publish_succeeded" -ne 1 ]]; then

            echo
            echo "MQTT publish failed after ${max_publish_attempts} attempts"
            echo
            echo "Subscriber output:"

            cat "$ack_log" || true

            exit 1
          fi

          # --------------------------------------------------------
          # Wait for OTA ACK / reboot
          # --------------------------------------------------------

          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))

          accepted_seen=0
          seen_lines=0

          echo
          echo "OTA command sent."
          echo "Waiting up to ${TIMEOUT_SECONDS}s for OTA result or device reboot..."
          echo

          while [[ $(date +%s) -lt "$deadline" ]]; do

            # Subscriber should remain alive.
            if ! kill -0 "$sub_pid" 2>/dev/null; then

              echo "MQTT subscriber exited while waiting for ACK"
              echo
              echo "Subscriber output:"

              cat "$ack_log" || true

              exit 1
            fi

            total_lines=$(wc -l < "$ack_log" || echo 0)

            if [[ "$total_lines" -gt "$seen_lines" ]]; then

              while [[ "$seen_lines" -lt "$total_lines" ]]; do

                seen_lines=$((seen_lines + 1))

                line=$(sed -n "${seen_lines}p" "$ack_log")

                echo "ACK raw: ${line}"

                # Remove MQTT topic prefix.
                msg="${line#${ack_topic} }"

                # --------------------------------------------------
                # Validate JSON
                # --------------------------------------------------

                if ! printf '%s' "$msg" | jq -e . >/dev/null 2>&1; then
                  echo "Ignoring non-JSON ACK"
                  continue
                fi

                # --------------------------------------------------
                # Extract common fields
                # --------------------------------------------------

                state=$(
                  printf '%s' "$msg" |
                    jq -r '.state // empty'
                )

                detail=$(
                  printf '%s' "$msg" |
                    jq -r '.detail // empty'
                )

                d_action=$(
                  printf '%s' "$msg" |
                    jq -r '.d_action // empty'
                )

                ack_device=$(
                  printf '%s' "$msg" |
                    jq -r '.device // empty'
                )

                fw_version=$(
                  printf '%s' "$msg" |
                    jq -r '.fw_version // empty'
                )

                chip_ip=$(
                  printf '%s' "$msg" |
                    jq -r '.chip_ip // empty'
                )

                boot_reason=$(
                  printf '%s' "$msg" |
                    jq -r '.boot_reason // empty'
                )

                # --------------------------------------------------
                # Explicit OTA state messages
                # --------------------------------------------------

                case "$state" in

                  accepted)

                    echo "OTA command accepted by device"

                    accepted_seen=1
                    continue
                    ;;

                  success)

                    echo
                    echo "======================================================"
                    echo "OTA SUCCESS"
                    echo "======================================================"
                    echo "Device reported explicit OTA success."

                    if [[ -n "$detail" ]]; then
                      echo "Detail: ${detail}"
                    fi

                    echo "======================================================"

                    exit 0
                    ;;

                  failed|rejected)

                    echo
                    echo "======================================================"
                    echo "OTA FAILED"
                    echo "======================================================"
                    echo "State:  ${state}"
                    echo "Detail: ${detail}"
                    echo "======================================================"

                    exit 1
                    ;;

                  busy)

                    echo
                    echo "======================================================"
                    echo "OTA FAILED"
                    echo "======================================================"
                    echo "Device is busy."
                    echo "Detail: ${detail}"
                    echo "======================================================"

                    exit 1
                    ;;

                esac

                # --------------------------------------------------
                # Device startup after OTA
                #
                # Example:
                #
                # {
                #   "device":"PS0HZW",
                #   "chip_id":277336689007388,
                #   "d_action":"startup",
                #   "fw_version":"1.0.2",
                #   "chip_ip":"192.168.1.245",
                #   "boot_reason":"SW"
                # }
                #
                # A startup message received AFTER we published the
                # OTA command means the device rebooted and returned
                # to MQTT.
                # --------------------------------------------------

                if [[ "$d_action" == "startup" ]]; then

                  # Extra safety: make sure startup belongs to the
                  # device targeted by this workflow.
                  if [[ -n "$ack_device" && "$ack_device" != "$DEVICE_ID" ]]; then

                    echo "Ignoring startup ACK from unexpected device:"
                    echo "Expected: ${DEVICE_ID}"
                    echo "Received: ${ack_device}"

                    continue
                  fi

                  echo
                  echo "======================================================"
                  echo "OTA SUCCESS - DEVICE RESTARTED"
                  echo "======================================================"
                  echo "Device:       ${ack_device:-$DEVICE_ID}"

                  if [[ -n "$fw_version" ]]; then
                    echo "FW version:   ${fw_version}"
                  fi

                  if [[ -n "$chip_ip" ]]; then
                    echo "IP address:   ${chip_ip}"
                  fi

                  if [[ -n "$boot_reason" ]]; then
                    echo "Boot reason:  ${boot_reason}"
                  fi

                  if [[ "$accepted_seen" -eq 1 ]]; then
                    echo "OTA accepted: yes"
                  else
                    echo "OTA accepted: not observed"
                  fi

                  echo
                  echo "Device rebooted and returned to MQTT."
                  echo "OTA smoke test PASSED."
                  echo "======================================================"

                  exit 0
                fi

                # --------------------------------------------------
                # Other JSON ACK
                # --------------------------------------------------

                if [[ -n "$state" ]]; then
                  echo "Ignoring non-terminal OTA state: ${state}"
                elif [[ -n "$d_action" ]]; then
                  echo "Ignoring device action: ${d_action}"
                else
                  echo "Ignoring unrelated JSON ACK"
                fi

              done
            fi

            sleep 2
          done

          # --------------------------------------------------------
          # Timeout
          # --------------------------------------------------------

          echo
          echo "======================================================"
          echo "OTA TEST TIMED OUT"
          echo "======================================================"
          echo "No OTA success or startup ACK received within"
          echo "${TIMEOUT_SECONDS} seconds."
          echo
          echo "Captured subscriber output:"
          echo "------------------------------------------------------"

          cat "$ack_log" || true

          echo "======================================================"

          exit 1
