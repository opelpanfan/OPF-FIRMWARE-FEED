name: Validate feed

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests and firmware images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check feed tree
        run: python3 .github/scripts/publish_firmware.py validate
